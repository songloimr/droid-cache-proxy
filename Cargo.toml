[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
authors = ["Droid Cache Proxy Contributors"]
license = "MIT OR Apache-2.0"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[workspace.dependencies]
# Internal crates
dcp-core = { path = "crates/dcp-core" }
dcp-proxy = { path = "crates/dcp-proxy" }
dcp-store = { path = "crates/dcp-store" }
dcp-transform = { path = "crates/dcp-transform" }
dcp-analyze = { path = "crates/dcp-analyze" }

# Async runtime & HTTP
tokio = { version = "1.43", features = ["full"] }
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
toml = "0.8"

# Storage
rusqlite = { version = "0.32", features = ["bundled"] }

# CLI & Utilities
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
sha2 = "0.10"
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
